name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test & Production Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install monorepo dependencies
        run: npm ci || npm install

      - name: Run TypeScript typecheck across monorepo
        run: npm run typecheck

      - name: Execute automated test suites
        run: npm run test --workspaces --if-present

      - name: Verify shared package build
        run: npm run build --workspace=@arcora/shared

      - name: Verify Cloud Run backend build
        run: npm run build --workspace=@arcora/backend

      - name: Verify production client build
        run: npm run build --workspace=@arcora/app
