<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcora | Household admin app for bills, subscriptions, warranties, documents, and reminders</title>
  <meta
    name="description"
    content="Arcora is a household admin app that helps people organize bills, subscriptions, warranties, reminders, and important documents in one calmer system."
  />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="__ARCORA_PUBLIC_SITE_URL__/">
  <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
  <link rel="shortcut icon" href="/icons/icon-192x192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#050816">
  <meta property="og:site_name" content="Arcora">
  <meta property="og:title" content="Arcora | Household admin app for bills, subscriptions, warranties, documents, and reminders">
  <meta
    property="og:description"
    content="Arcora helps households keep bills, subscriptions, warranties, documents, and reminders easier to trust."
  >
  <meta property="og:type" content="website">
  <meta property="og:url" content="__ARCORA_PUBLIC_SITE_URL__/">
  <meta property="og:image" content="__ARCORA_PUBLIC_SITE_URL__/icons/icon-512x512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Arcora | Household admin app for bills, subscriptions, warranties, documents, and reminders">
  <meta
    name="twitter:description"
    content="Arcora helps households keep bills, subscriptions, warranties, documents, and reminders easier to trust."
  >
  <meta name="twitter:image" content="__ARCORA_PUBLIC_SITE_URL__/icons/icon-512x512.png">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #050816;
      color: rgba(255, 255, 255, 0.72);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #root:empty {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(56, 189, 248, 0.12), transparent 26%),
        #050816;
    }

    #root:empty::before {
      content: "Loading Arcora...";
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.72);
    }
  </style>

  <!-- Theme flash-prevention: apply persisted theme before first paint -->
  <script>
    try {
      var stored = localStorage.getItem('arcora-ui-storage');
      var parsed = stored ? JSON.parse(stored) : null;
      var theme = parsed && parsed.state && parsed.state.theme === 'light' ? 'light' : 'dark';
      document.documentElement.classList.remove('dark', 'light');
      document.documentElement.classList.add(theme);
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
